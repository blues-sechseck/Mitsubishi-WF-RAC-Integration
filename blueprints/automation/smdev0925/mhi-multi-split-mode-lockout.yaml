# MHI multi-split mode lockout resolver - notes for anyone reading the source.
# None of this is in the blueprint description, which is a setup form rather
# than a document.
#
# THE PROBLEM
# One outdoor unit, one mode at a time. Whichever head claims the compressor
# first wins; heads wanting the opposite mode are locked out and their rooms
# drift, showing "auto" while doing nothing. MHI's AUTO also latches its
# heat/cool choice, so a lockout can persist long after the reason for it has
# gone - including while the head holding the system sits idle.
#
# THE DESIGN - TRUST THE UNIT
# This automation makes no judgement about what any room needs. The unit already
# decides that, per room, with its own sensor and its own logic. Second-guessing
# it means running a competing thermostat off the same return-air sensor, which
# in practice produced a system that hunted between heat and cool every 15
# minutes, chasing its own measurement error.
#
# Two inputs, both straight from the unit. Cool/Heat Status is what a head is
# asking the outdoor unit for - the vote, and the only demand signal. Compressor
# Demand is whether the compressor is running for that head right now. Room
# temperature and setpoint are logged as evidence only; nothing branches on
# them. If you find yourself adding a threshold in degrees here, the old design
# is creeping back in.
#
# WHY FAN-ONLY AND NOT DRY
# Fan-only is what drops the latch, because the Cool/Heat Status sensor reports
# nothing in that state. Dry is still a cooling vote and would keep blocking.
#
# HOW EACH MODE IS TREATED
# `auto` is a full participant - its vote is the unit's own judgement. `cool`,
# `heat` and `dry` set a hard mode lock: while any head is explicitly in cool the
# system is never handed away from cooling, and vice versa (dry counts as cool).
# An idle head left on in the opposite mode still gets hot gas bleeding through
# its coil on the shared circuit and runs its fan, so it blows warm air into a
# room you asked to be cooled. Release the lock by putting that head back to auto
# or switching it off. Setting one head to `cool` and another to `heat` pins both
# sides at once: nothing can stand down, and the automation says so in the
# logbook rather than rotating silently. `fan_only` and `off` are ignored and
# never touched.
#
# HOW THE THREE LISTS ARE MATCHED
# By device, so their order does not matter; what matters is that every head you
# list contributes all three entities. A head missing its status sensor has no
# vote and no conflict is ever seen; a head missing its demand sensor cannot be
# told apart from one that just had its turn, so the automation declines to act
# rather than guess. Both fail safe and silent.
#
# TWO THINGS TO KNOW BEFORE CHANGING THE NUMBERS
# After a Home Assistant restart every demand sensor's last change is young, so
# every head reads as calling and nothing rotates until the release grace has
# passed. That settling window is a side effect of the grace period, not a
# separate mechanism: shortening the grace shortens the window too.
#
# A stand-down that logs but does not stick means the delay was too short - it
# has to outlast the outdoor unit letting go AND the waiting side re-latching and
# starting to call. Lengthen it, never shorten it. And the unit bursts on a mode
# change, running hard and overshooting for roughly 15 minutes; the cooldown has
# to stay longer than that, or each change starts reacting to the overshoot from
# the last one.
#
# ONE KNOWN EXPOSURE
# Standing down and restoring happen in a single run with a delay between. If
# that run is interrupted - a restart, a reload, a config check - the restore
# never happens and those heads stay in fan-only. They then have no vote, so the
# automation cannot see them to fix it. Set them back to auto by hand; they show
# up in the trace as heads that are not participating.

blueprint:
  name: MHI multi-split mode lockout resolver
  author: smdev0925
  homeassistant:
    min_version: "2024.10.0"
  description: >-
    **Version 1.0.0** — 14 September 2026


    To keep this up to date automatically, install
    [Blueprints Updater](https://github.com/luuquangvu/blueprints-updater) from
    HACS. Needs Home Assistant 2024.12 or later.


    Frees a head that is locked out on a multi-split. One outdoor unit serves one
    mode at a time, so a head asking for the opposite mode gets nothing and its
    room drifts — and MHI's AUTO holds on to its choice even after the head that
    claimed it has gone quiet.


    ## The rules


    1. Every head agrees — nothing to do.

    2. Heads disagree and one is calling — the head running the compressor keeps
       it.

    3. Heads disagree and none is calling — the side served most recently drops
       to fan-only for a few minutes. That releases the outdoor unit, the waiting
       side takes it, and the heads return to their mode.


    It decides nothing about what a room needs. The unit already does that. Both
    signals come straight from the unit: **Cool/Heat Status** is the vote,
    **Compressor Demand** is the priority.


    ## Read this first


    A head you set to `cool`, `heat` or `dry` yourself is never overridden, and
    while it is there the system is never handed away from that side. Put it back
    to `auto` to release it. `fan_only` and `off` are ignored.


    **Do not use this and the MHI multi-split AUTO replacement on the same
    heads.** They work against each other.


    If a run is interrupted part-way, a head can be left in `fan_only` and
    nothing here will bring it back. Set it to `auto` by hand.
  domain: automation
  input:
    fleet:
      name: The heads
      icon: mdi:hvac
      description: >-
        Every indoor unit that should take part. Pick the same units in all
        three lists.
      input:
        climate_entities:
          name: Climate entities
          selector:
            entity:
              multiple: true
              filter:
                - integration: mitsubishi_wf_rac
                  domain: climate
        judge_sensors:
          name: Cool Hot Judge sensors
          description: >-
            Disabled by default — enable one per unit first. It is the sensor
            called "Cool Hot Judge" on each indoor unit's device page.
          selector:
            entity:
              multiple: true
              filter:
                - integration: mitsubishi_wf_rac
                  domain: sensor
        demand_sensors:
          name: Compressor Demand sensors
          description: Enabled by default — one per unit, nothing to switch on.
          selector:
            entity:
              multiple: true
              filter:
                - integration: mitsubishi_wf_rac
                  domain: binary_sensor
    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        release_grace_minutes:
          name: Release grace
          description: >-
            How long a head still counts as in use after its compressor stops.
            The compressor cycles mid-job, so without this a head that is not
            finished loses the system. Everything must be quiet this long before
            priority changes hands.
          default: 10
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: minutes
              mode: box
        cooldown_minutes:
          name: Cooldown between stand-downs
          description: >-
            Keep this longer than the unit's post-mode-change settle of roughly
            15 minutes.
          default: 20
          selector:
            number:
              min: 18
              max: 120
              unit_of_measurement: minutes
              mode: box
        relax_delay:
          name: Stand-down delay
          description: >-
            How long the standing-down heads sit in fan-only. Four minutes is
            proven on a four-head SCM80.
          default:
            hours: 0
            minutes: 4
            seconds: 0
          selector:
            duration:

mode: single
max_exceeded: silent

trace:
  stored_traces: 25

triggers:
  - trigger: time_pattern
    minutes: "/2"

variables:
  # Bumped on every change. Printed at the front of each logbook entry so the
  # version actually running can be read off a live system.
  version: "1.0.0"

  climate_entities: !input climate_entities
  judge_sensors: !input judge_sensors
  demand_sensors: !input demand_sensors
  release_grace_minutes: !input release_grace_minutes
  cooldown_minutes: !input cooldown_minutes
  relax_delay: !input relax_delay

  # One row per head that is on and can hold a latch. The three lists are
  # matched by device rather than by position, so their order does not matter.
  #   vote    = 'cooling' | 'heating' | 'none' (Cool/Heat Status - the demand)
  #   calling = compressor running for this head, plus the grace period
  #   since   = minutes since its demand last changed; smallest = most recent
  #   temp/target are evidence only. Nothing branches on them.
  fleet: >-
    {% set ns = namespace(items=[]) %}
    {% for c in climate_entities %}
      {% set dev = device_id(c) %}
      {% set mode = states(c) %}
      {% if dev is not none and mode in ['auto', 'cool', 'heat', 'dry'] %}
        {% set judge = judge_sensors | select('in', device_entities(dev)) | list | first %}
        {% set demand = demand_sensors | select('in', device_entities(dev)) | list | first %}
        {% set j = states(judge) if judge is not none else 'unknown' %}
        {% set vote = j if j in ['cooling', 'heating'] else 'none' %}
        {% set d = states[demand] if demand is not none else none %}
        {% set since = 99999 if d is none
                       else ((now() - d.last_changed).total_seconds() / 60) %}
        {% set calling = d is not none and (d.state == 'on'
                         or (d.state == 'off' and since < release_grace_minutes)) %}
        {% set ns.items = ns.items + [{
             'entity': c,
             'mode': mode,
             'vote': vote,
             'calling': calling,
             'since': since | round(1),
             'temp': state_attr(c, 'current_temperature'),
             'target': state_attr(c, 'temperature') }] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  # The two camps. A lockout exists if and only if both are occupied.
  conflict: >-
    {{ fleet | selectattr('vote', 'eq', 'cooling') | list | count > 0
       and fleet | selectattr('vote', 'eq', 'heating') | list | count > 0 }}

  # Anything actively running? If so it keeps the system, full stop.
  in_use: "{{ fleet | selectattr('calling') | list }}"

  # Which side just had its turn. The head whose demand changed most recently
  # tells us what the compressor was last doing. Only consulted once everything
  # has gone quiet, which is the only time it is meaningful.
  last_served: >-
    {% set ns = namespace(t=99999, mode='none') %}
    {% for f in fleet if f.vote in ['cooling', 'heating'] %}
      {% if f.since < ns.t %}
        {% set ns.t = f.since %}
        {% set ns.mode = f.vote %}
      {% endif %}
    {% endfor %}
    {{ ns.mode }}

  # ...so the other side is the one that has been waiting.
  waiting_side: >-
    {{ 'heating' if last_served == 'cooling'
       else 'cooling' if last_served == 'heating'
       else 'none' }}

  # The heads that stand down: everything voting for the side that just had its
  # turn. Fan-only drops the latch that holds the lock.
  standdown: "{{ fleet | selectattr('vote', 'eq', last_served) | list }}"

  # Modes an explicitly-set head requires. Never handed away. See the header.
  protected_modes: >-
    {% set ns = namespace(items=[]) %}
    {% for f in fleet %}
      {% if f.mode in ['cool', 'dry'] and 'cooling' not in ns.items %}
        {% set ns.items = ns.items + ['cooling'] %}
      {% elif f.mode == 'heat' and 'heating' not in ns.items %}
        {% set ns.items = ns.items + ['heating'] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  # The heads whose explicit mode blocks this particular stand-down, and whether
  # both modes are pinned at once - the state a user is most likely to create by
  # hand, and the one worth telling them about.
  locked_by: >-
    {% set ns = namespace(items=[]) %}
    {% for f in fleet %}
      {% if (f.mode in ['cool', 'dry'] and last_served == 'cooling')
         or (f.mode == 'heat' and last_served == 'heating') %}
        {% set ns.items = ns.items + [f] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  deadlocked: >-
    {{ 'cooling' in protected_modes and 'heating' in protected_modes }}

conditions:
  # A genuine split: heads are asking for both modes at once.
  - condition: template
    value_template: "{{ conflict }}"

  # In use means priority. Somebody is running the compressor, so they keep it
  # until they are done. The release grace rides through cycling.
  - condition: template
    value_template: "{{ in_use | count == 0 }}"

  # We know which side just finished, and there is somebody to stand down.
  - condition: template
    value_template: >-
      {{ last_served in ['cooling', 'heating'] and standdown | count > 0 }}

  - condition: template
    value_template: >-
      {% set lt = this.attributes.get('last_triggered') %}
      {{ lt is none or (now() - lt).total_seconds() >= cooldown_minutes * 60 }}

actions:
  # The mode lock is checked here rather than as a condition, so that being
  # blocked by a manual mode is reported instead of failing silently. The
  # cooldown above throttles it: at most one line per cooldown while the lock
  # persists, rather than one every two minutes.
  - choose:
      # Reachable only when the automation is triggered by hand: a manual run
      # skips the conditions above, and without this it would fall through to
      # the stand-down with nothing to stand down.
      - alias: Nothing to resolve — reached only on a manual run
        conditions:
          - condition: template
            value_template: >-
              {{ not conflict or in_use | count > 0
                 or last_served not in ['cooling', 'heating']
                 or standdown | count == 0 }}
        sequence:
          - action: logbook.log
            data:
              name: MHI Mode Lockout
              message: >-
                v{{ version }} — manual run ignored, nothing to resolve.
                {%- if not conflict %} The heads do not disagree.
                {%- elif in_use | count > 0 %}
                {{ in_use | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
                {{ 'is' if in_use | count == 1 else 'are' }} still running, so
                the mode is not free.
                {%- else %} There is nothing to stand down.{% endif %}

      - alias: Blocked by a head someone set to an explicit mode
        conditions:
          - condition: template
            value_template: "{{ last_served in protected_modes }}"
        sequence:
          - action: logbook.log
            data:
              name: MHI Mode Lockout
              message: >-
                v{{ version }} — {{ 'DEADLOCK' if deadlocked else 'held' }} by
                manual modes.
                {{ waiting_side }} cannot get the system because
                {{ locked_by | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
                {{ 'is' if locked_by | count == 1 else 'are' }} set to
                {{ locked_by | map(attribute='mode') | unique | join('/') }}.
                {%- if deadlocked %} Both modes are pinned at once, so no
                stand-down is possible at all.{% endif %}
                Return {{ 'one of them' if locked_by | count > 1 else 'it' }}
                to auto, or switch off, to release it.
                Fleet: {% for f in fleet %}{{ f.entity | replace('climate.', '') }}
                [{{ f.mode }} vote={{ f.vote }}]{{ ", " if not loop.last }}{% endfor %}

    default:
      - alias: Log it, with temperatures as evidence only
        action: logbook.log
        data:
          name: MHI Mode Lockout
          message: >-
            v{{ version }} — {{ last_served }} had its turn, standing down
            {{ standdown | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
            so {{ waiting_side }} can run.
            Fleet: {% for f in fleet %}{{ f.entity | replace('climate.', '') }}
            [{{ f.mode }} vote={{ f.vote }} calling={{ 'Y' if f.calling else 'N' }}
            idle={{ f.since }}m {{ f.temp }}/{{ f.target }}C]{{ ", " if not loop.last }}{% endfor %}

      - alias: Stand that side down, dropping its latch
        action: climate.set_hvac_mode
        target:
          entity_id: "{{ standdown | map(attribute='entity') | list }}"
        data:
          hvac_mode: fan_only

      - alias: Let the outdoor unit release and the waiting side take over
        delay: "{{ relax_delay }}"

      - alias: Return each head to the mode it was in
        repeat:
          for_each: "{{ standdown }}"
          sequence:
            # Only write if the head is still where we put it. Every
            # set_hvac_mode call takes the unit's ~60s command lease and the
            # integration does not dedupe, so restoring a head that is already
            # back would cost a round trip for nothing. If you changed its mode
            # by hand during the window, your choice stands.
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item.entity) == 'fan_only' }}"
              then:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: "{{ repeat.item.entity }}"
                  data:
                    hvac_mode: "{{ repeat.item.mode }}"
