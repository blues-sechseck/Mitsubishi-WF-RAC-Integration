# Service ID
set_horizontal_swing_mode:
  # Service name as shown in UI
  name: Set horizontal swing mode
  # Description of the service
  description: Sets the horizontal (left/right) swing mode
  # This is an entity service registered on the climate platform, so target
  # entities of this integration's climate domain rather than devices.
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  # Different fields that your service accepts
  fields:
    # Key of the field
    swing_mode:
      # Field name as shown in UI
      name: Horizontal swing mode
      # Description of the field
      description: Which horizontal swing mode to set
      # Whether or not field is required (default = false)
      required: true
      # Advanced fields are only shown when the advanced mode is enabled for the user (default = false)
      advanced: false
      # Example value that can be passed for this field
      example: "left_right_auto"
      # The default field value
      default: "left_right_auto"
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        select:
          options:
            - "left_right_auto"
            - "left_left"
            - "left_center"
            - "center_center"
            - "center_right"
            - "right_right"
            - "left_right"
            - "right_left"
# Service ID
set_vertical_swing_mode:
  # Service name as shown in UI
  name: Set vertical swing mode
  # Description of the service
  description: Sets the vertical (up/down) swing mode
  # This is an entity service registered on the climate platform, so target
  # entities of this integration's climate domain rather than devices.
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  # Different fields that your service accepts
  fields:
    # Key of the field
    swing_mode:
      # Field name as shown in UI
      name: vertical swing mode
      # Description of the field
      description: Which vertical swing mode to set
      # Whether or not field is required (default = false)
      required: true
      # Advanced fields are only shown when the advanced mode is enabled for the user (default = false)
      advanced: false
      # Example value that can be passed for this field
      example: "up_down_auto"
      # The default field value
      default: "up_down_auto"
      # Selector (https://www.home-assistant.io/docs/blueprint/selectors/) to control the input UI for this field
      selector:
        select:
          options:
            - "up_down_auto"
            - "highest"
            - "middle"
            - "normal"
            - "lowest"
            - "3d_auto"
