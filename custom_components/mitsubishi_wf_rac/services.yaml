# Names and descriptions live in strings.json, not here: this file has no
# language variants, so anything written in it reaches every user in English.
set_horizontal_swing_mode:
  # An entity service registered on the climate platform, so target entities
  # of this integration's climate domain rather than devices.
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  fields:
    swing_mode:
      required: true
      example: "left_right_auto"
      default: "left_right_auto"
      selector:
        select:
          translation_key: horizontal_swing_mode
          options:
            - "left_right_auto"
            - "left_left"
            - "left_center"
            - "center_center"
            - "center_right"
            - "right_right"
            - "left_right"
            - "right_left"
set_vertical_swing_mode:
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  fields:
    swing_mode:
      required: true
      example: "up_down_auto"
      default: "up_down_auto"
      selector:
        select:
          translation_key: vertical_swing_mode
          options:
            - "up_down_auto"
            - "highest"
            - "middle"
            - "normal"
            - "lowest"
            - "3d_auto"
request_home_leave_mode_status:
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
set_home_leave_mode:
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  fields:
    temp_rule_cooling:
      required: true
      example: 35
      selector:
        number:
          min: 10
          max: 50
          step: 0.5
          unit_of_measurement: "°C"
    temp_setting_cooling:
      required: true
      example: 33
      selector:
        number:
          min: 10
          max: 50
          step: 0.5
          unit_of_measurement: "°C"
    air_flow_cooling:
      required: true
      example: 0
      default: 0
      selector:
        select:
          translation_key: home_leave_air_flow
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
    temp_rule_heating:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    temp_setting_heating:
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    air_flow_heating:
      required: true
      example: 0
      default: 0
      selector:
        select:
          translation_key: home_leave_air_flow
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
set_external_temperature:
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  fields:
    temperature:
      required: false
      selector:
        number:
          min: -15.25
          max: 48.25
          step: 0.25
          unit_of_measurement: "°C"
set_energy_total:
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: sensor
  fields:
    value:
      required: true
      example: 412.5
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "kWh"
