# Service ID
request_home_leave_mode_status:
  name: Request Home Leave Mode status
  description: >-
    Asks the unit to report its current Home Leave Mode thresholds/airflow.
    Call once so the number/select entities have a value to show and edit -
    the unit omits them from a plain poll otherwise. Only supported on models
    with the HomeLeaveMode capability (#187).
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
# Service ID
set_home_leave_mode:
  name: Set Home Leave Mode
  description: >-
    Writes new Home Leave Mode thresholds/airflow for cooling and heating.
    Only supported on models with the HomeLeaveMode capability (#187).
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: climate
  fields:
    temp_rule_cooling:
      name: Cooling temp rule
      description: Outdoor/room temperature threshold above which cooling Home Leave Mode engages, in °C.
      required: true
      example: 35
      selector:
        number:
          min: 10
          max: 50
          step: 0.5
          unit_of_measurement: "°C"
    temp_setting_cooling:
      name: Cooling temp setting
      description: Target temperature while cooling Home Leave Mode is active, in °C.
      required: true
      example: 33
      selector:
        number:
          min: 10
          max: 50
          step: 0.5
          unit_of_measurement: "°C"
    air_flow_cooling:
      name: Cooling airflow
      description: Fan speed while cooling Home Leave Mode is active.
      required: true
      example: 0
      default: 0
      selector:
        select:
          options:
            - label: "Auto"
              value: "0"
            - label: "1"
              value: "1"
            - label: "2"
              value: "2"
            - label: "3"
              value: "3"
            - label: "4"
              value: "4"
    temp_rule_heating:
      name: Heating temp rule
      description: Outdoor/room temperature threshold below which heating Home Leave Mode engages, in °C.
      required: true
      example: 0
      selector:
        number:
          min: -20
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    temp_setting_heating:
      name: Heating temp setting
      description: Target temperature while heating Home Leave Mode is active, in °C.
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    air_flow_heating:
      name: Heating airflow
      description: Fan speed while heating Home Leave Mode is active.
      required: true
      example: 0
      default: 0
      selector:
        select:
          options:
            - label: "Auto"
              value: "0"
            - label: "1"
              value: "1"
            - label: "2"
              value: "2"
            - label: "3"
              value: "3"
            - label: "4"
              value: "4"
# Service ID
set_energy_total:
  name: Set Energy Usage Total
  description: >-
    Overwrites the accumulated Energy Usage Total for one unit. Use 0 to
    reset it, or a reading from a meter you kept previously to carry that
    figure over. Only affects the integration's own total - the unit's
    counter cannot be written.
  target:
    entity:
      integration: mitsubishi_wf_rac
      domain: sensor
  fields:
    value:
      name: Value
      description: New total in kWh.
      required: true
      example: 412.5
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "kWh"
